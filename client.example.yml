# ~/.gotunnel/client.yml
client:
  gateway_url: "ws://localhost/connect"
  token: "your-api-token-here"
  local_bind: "127.0.0.1"
  tunnels:
    - name: "app"
      port: 3000
      protocol: "http"
      subdomain: "myapp"
    - name: "ssh"
      port: 22
      protocol: "tcp"
  reconnect:
    max_retries: 0
    backoff_ms: 1000
  heartbeat_seconds: 10
  tls:
    skip_verify: false
    ca_file: ""
