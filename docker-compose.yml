version: "3.7"
services:
  gotunnel:
    build: .
    image: gotunnel:latest
    restart: unless-stopped
    volumes:
      - ./config.example.yml:/etc/gotunnel/config.yml:ro
      - certs:/var/lib/gotunnel/certs
    environment:
      - GOTUNNEL_CONFIG=/etc/gotunnel/config.yml
    ports:
      - "80:80"
      - "443:443"
      - "9090:9090"

volumes:
  certs:
